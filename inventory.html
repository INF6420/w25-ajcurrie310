<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The inventory page and display of all books for Bookworm Boutique, a secondhand bookstore.">
    <title>Alexis Currie - Bookstore Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="main-menu">
           <ul class="main-nav">
           <li><a href="index.html">Home</a></li>
           <li><a href="about_us.html">About Us</a></li>
           </ul> 
           <div class="logo">
            <img src="images/bookstore_logo.avif" alt ="Bookworm Boutique Logo" width="400" height="400">
        </div>  
        <div class="search-container">
            <input id="searchInput" class="search-box" type="search" placeholder="Search for a page">
            <ul id="resultsList"></ul>
        </div>        
        </nav>
    </header>
    <main>
        <h1>Our Collection</h1>
        <div class="row">
            <div class="column"><img height="500" width= "500" src="images/book_1.avif" alt="Lord of the Flies"></div>
            <div class="column"><img height="500" width= "500" src="images/book_2.avif" alt="Moby Dick"></div>
            <div class="column"><img height="500" width= "500" src="images/book_3.avif" alt="The Happy Prince"></div>
        </div>
        <div class="row">
            <div class="column"><img height="500" width= "500" src="images/book_4.avif" alt="Harmonium"></div>
            <div class="column"><img height="500" width= "500" src="images/book_5.avif" alt="Harry Potter and the Sorcerer's Stone"></div>
            <div class="column"><img height="500" width= "500" src="images/book_6.avif" alt="The Hobbit"></div>
        </div>
    </main>
    <footer>
        <nav class="footer-menu">
            <ul class="footer-nav">
             <li><a href="index.html">Home</a></li>
             <li><a href="about_us.html">About Us</a></li>
            </ul> 
        </nav>
        <div class="social-media">
            <ul>
                <li><a href=""><img height="20" width="20" src="images/instagram_logo.svg" alt="Instagram"></a></li>
                <li><a href=""><img height="20" width="20" src="images/facebook_logo.svg" alt="Facebook"></a></li>
                <li><a href=""><img height="20" width="20" src="images/twitter_logo.svg" alt="Twitter"></a></li>
            </ul>
        </div>
    </footer>
    <script>
        const pages = [
          { title: 'Home', url: 'index.html' },
          { title: 'Inventory', url: 'inventory.html' },
          { title: 'About Us', url: 'about_us.html' },
          // Add more pages as needed
        ];
      
        const input = document.getElementById('searchInput');
        const results = document.getElementById('resultsList');
      
        input.addEventListener('input', function () {
          const query = this.value.toLowerCase();
          results.innerHTML = '';
      
          if (query.length > 0) {
            const matches = pages.filter(page => page.title.toLowerCase().includes(query));
      
            matches.forEach(page => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = page.url;
              a.textContent = page.title;
              li.appendChild(a);
              results.appendChild(li);
            });
      
            if (matches.length === 0) {
              results.innerHTML = '<li>No results found</li>';
            }
          }
        });
      </script>
</body>
</html>
